<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="絵文字で気分を記録し、1日の推移を見ながら日記を書くアプリ">
  <!-- 画面幅にフィットさせ、入力欄タップ時の拡大を抑える（スマホでアプリらしく見せるため） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- ブラウザUI（Androidのアドレスバー等）をアプリの背景色に合わせる -->
  <meta name="theme-color" content="#FBF8FF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- 背景が明るいので、ステータスバーは黒文字の既定スタイルにする -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Emo日記">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Emo日記</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    通知の宛先(FCMトークン)の取得。

    firebase_messaging プラグインは、iPhone上のWebでも「ネイティブiOSアプリ」と
    判定してiOS専用の処理(getAPNSToken)を呼んでしまい、Webには実装が無いため
    必ず失敗する。そのためプラグインを経由せず、Firebase公式のJSライブラリを
    直接使って取得する。
  -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
  <script>
    window.emoGetPushToken = async function (vapidKey) {
      if (!firebase.apps.length) {
        firebase.initializeApp({
          apiKey: 'AIzaSyDsChpiww9yyHKfcorCfOeVv06yaZeYUuo',
          appId: '1:567681005392:web:b38f15f625319d526fde55',
          messagingSenderId: '567681005392',
          projectId: 'emo-nikki-eyuma1218-4155e',
          authDomain: 'emo-nikki-eyuma1218-4155e.firebaseapp.com',
          storageBucket: 'emo-nikki-eyuma1218-4155e.firebasestorage.app'
        });
      }
      // 受信用のservice workerを明示的に登録して渡す。
      var registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
      return await firebase.messaging().getToken({
        vapidKey: vapidKey || undefined,
        serviceWorkerRegistration: registration
      });
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
