name: 感情記録のリマインダー

# ミニPCが止まったときの「保険」として定時実行する。
#
# 本番は大学のミニPC上の systemd タイマー (emo-reminder.timer) が毎時0分ちょうどに
# 送る。こちらはそれより少し遅れて動き、ミニPCが送れていればそのまま何もしない。
#
# 二重送信にはならない。送信記録 reminders/{yyyy-MM-dd-HH} を create できた側だけが
# 送る仕組みで、create は既にあると必ず失敗するため、同時に動いても1通しか出ない。
#
# 時刻は当てにしない。GitHub の定時実行は実測で7回中3回が実行されず、動いた回も
# 最大55分遅れていた（混雑時は実行そのものが破棄される）。そのため1時間に4回試して
# 取りこぼしを拾う。ミニPCが動いている限り、ここでの遅れは表に出ない。
#
# cron の時刻は UTC。日本時間から9時間引いた値を書く。
on:
  schedule:
    # 日本時間 10:00〜19:00 の毎時（記録の通知）
    - cron: '7,22,37,52 1-10 * * *'
    # 日本時間 21:00（日記の通知）
    - cron: '7,22,37,52 12 * * *'

  # 動作確認と、今すぐ送りたいとき。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '送信せず対象だけ確認する'
        type: boolean
        default: false
      force:
        description: '時間帯の判定を無視して送る（今すぐ届くか試す）'
        type: boolean
        default: false
      kind:
        description: 'force のときに送る種類（auto=その時刻の種類）'
        type: choice
        options: [auto, record, diary]
        default: auto

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージのインストール
        run: pip install -r tools/requirements.txt

      - name: リマインダーを送信
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # 実行のたびに変わるランナー名ではなく、固定の名前で記録に残す。
          # ミニPC(minipc)と見分けられるようにするため。
          REMINDER_SOURCE: github-actions
          # 見張り(healthchecks.io)への連絡。GitHub の Secret に入れておく。
          # 未設定でも通知の送信は動く（連絡だけ行われない）。
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          python tools/send_reminders.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.force && inputs.kind != 'auto' && format('--kind {0}', inputs.kind) || '' }}
