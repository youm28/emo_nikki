name: 感情記録のリマインダー

# 元研究(Emoji_watch)に合わせて 10:00〜19:00 JST の毎時に送る。
# GitHub Actions の cron は UTC なので、JST(UTC+9) から 9 時間引いて 01:00〜10:00 UTC。
#
# 毎時0分に1回だけ回していた頃は、実測で7回中3回が実行されず、動いた回も
# 最大55分遅れていた。schedule は「その時刻に必ず動く」保証がなく、混雑時は
# 実行そのものが破棄されるため。そこで1時間に4回試し、実際に送るかどうかは
# send_reminders.py 側で判定する（同じ時間帯には1回しか送らない）。
#
# 分を 0 にしないのは、毎時0分が世界中のワークフローと重なっていちばん
# 落ちやすいため。ばらけた分に置いている。
on:
  schedule:
    - cron: '7,22,37,52 1-10 * * *'
  # 動作確認用に手動でも回せるようにしておく。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '送信せず対象だけ確認する'
        type: boolean
        default: false
      force:
        description: '時間帯の判定を無視して送る（今すぐ届くか試す）'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージのインストール
        run: pip install -r tools/requirements.txt

      - name: リマインダーを送信
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # 実行のたびに変わるランナー名ではなく、固定の名前で記録に残す。
          # ミニPCと並走させるので、どちらが送ったかを後から見分けるため。
          REMINDER_SOURCE: github-actions
        run: |
          python tools/send_reminders.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}
