name: 感情記録のリマインダー

# 定時実行はしない。手動実行のみ残してある。
#
# 10:00〜19:00 JST の毎時の送信は、大学のミニPC上の systemd タイマー
# (emo-reminder.timer) が毎時0分ちょうどに行う。そちらが安定して動くことを
# 確認できたので、こちらの schedule は外した。
#
# schedule を外した理由は、GitHub の定時実行が当てにならないため。実測では
# 7回中3回が実行されず、動いた回も最大55分遅れていた。混雑時は実行そのものが
# 破棄される仕組みなので、時刻の正確さが要る用途には向かない。
#
# 手動実行を残しているのは、ミニPCが止まったときの応急手段のため。
# 「Run workflow」から force を付ければ、その場で通知を送れる。
# 実験期間中は schedule を戻して並走させるとよい（同じ時間帯には1回しか
# 送らないので、二重送信にはならない）。
on:
  # 動作確認と、ミニPCが止まったときの応急手段。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '送信せず対象だけ確認する'
        type: boolean
        default: false
      force:
        description: '時間帯の判定を無視して送る（今すぐ届くか試す）'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージのインストール
        run: pip install -r tools/requirements.txt

      - name: リマインダーを送信
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # 実行のたびに変わるランナー名ではなく、固定の名前で記録に残す。
          # ミニPC(minipc)と見分けられるようにするため。
          REMINDER_SOURCE: github-actions
        run: |
          python tools/send_reminders.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}
